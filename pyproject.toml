[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cell2image"
version = "0.3.1"
description = "Toolbox for converting cell data to images"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "h5py",
    "numba",
    "numpy",
    "scipy",
]

[project.optional-dependencies]
# images, frames and videos, including the c2i-video and c2i-frame commands
render = [
    "click",
    "ffmpy",
    "matplotlib",
    "pillow",
    "tqdm",
]
# reading .vtk input (h5 input works without it)
vtk = ["vtk"]
all = ["cell2image[render,vtk]"]

[project.scripts]
c2i-video = "cell2image.video_renderer:main"
c2i-frame = "cell2image.frame_exporter:main"
